services:

  nginx:
    image: nginx:latest
    container_name: ibge_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./frontend:/usr/share/nginx/html
    depends_on:
      - backend

  backend:
    build: ./backend
    container_name: ibge_backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ibge_analytics
      DB_USER: wallace_praxedes
      DB_PASSWORD: Wall123@
    depends_on:
      - postgres

  postgres:
    image: postgres:16
    container_name: ibge_postgres
    environment:
      POSTGRES_DB: ibge_analytics
      POSTGRES_USER: wallace_praxedes
      POSTGRES_PASSWORD: Wall123@
    ports:
      - "5432:5432"
    volumes:
      - dados_postgres:/var/lib/postgresql/data

volumes:
  dados_postgres: